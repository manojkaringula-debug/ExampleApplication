
version: 2.1

workflows:
  build_and_deploy:
    jobs:
      - build:
          filters:
            branches:
              only: main
      - deploy:
          requires:
            - build
          filters:
            branches:
              only: main

jobs:
  build:
    working_directory: ~/ExampleApplication
    docker:
      - image: circleci/node:10.16.3
    steps:
      - checkout
      - run:
          name: update-npm
          command: 'sudo npm install -g npm@5'
      - restore_cache:
          key: dependency-cache-{{ checksum "package-lock.json" }}
      - run:
          name: install-npm
          command: npm install
      - save_cache:
          key: dependency-cache-{{ checksum "package-lock.json" }}
          paths:
            - ./node_modules

  deploy:
    docker:
      - image: cimg/base:stable
    steps:
      - add_ssh_keys:
          fingerprints:
            - "SHA256:3A1zWI4wcQTWWYRjEI6djta4ztEgl7X6kb4wJQmOsyY"
      - run:
          name: Deploy application to AWS EC2
          command: |
            ssh-keyscan -H "$EC2_PUBLIC_DNS" >> ~/.ssh/known_hosts
            ssh "$EC2_USERNAME@$EC2_PUBLIC_DNS" \
              'bash /home/ubuntu/ExampleApplication/deploy.sh'
